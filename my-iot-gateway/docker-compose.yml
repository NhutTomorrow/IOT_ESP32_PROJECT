version: '3.8'
services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto-config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  logic-gateway:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    depends_on:
      - mqtt-broker
